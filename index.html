<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Finanzas</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
body{margin:0;font-family:-apple-system;background:#f4f6f8}
header{background:#0f172a;color:white;padding:18px;text-align:center;font-size:22px;font-weight:700}
nav{display:flex;background:white}
nav button{flex:1;padding:14px;border:0;font-weight:700}
nav button.active{background:#0f172a;color:white}
section{display:none;padding:16px}
section.active{display:block}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:16px}
input,select{width:100%;padding:10px;margin:6px 0;border-radius:10px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#0f172a;color:white;margin-top:8px}
.btnBlue{background:#2563eb}
.btnRed{background:#dc2626}
.btnEdit{background:#f59e0b}
.mov{border-bottom:1px solid #ccc;padding:10px 0}
.ok{color:green;font-weight:700}
.no{color:red;font-weight:700}
</style>
</head>

<body>

<header>Mis Finanzas</header>

<nav>
<button class="active" onclick="showTab('tc',this)">TC</button>
<button onclick="showTab('bancos',this)">Bancos</button>
<button onclick="showTab('resumen',this)">Resumen</button>
</nav>

<section id="tc" class="active">
<div class="card">
<input type="date" id="tcFecha">
<select id="tcTarjeta"><option>Pichincha</option><option>Produbanco</option></select>
<input id="tcConcepto" placeholder="Concepto">
<input id="tcDetalle" placeholder="Detalle">

<select id="tcTipo" onchange="controlCamposTC()">
<option>Corriente</option>
<option>Diferido</option>
</select>

<input type="number" id="tcPagadas" placeholder="Cuotas pagadas">
<input type="number" id="tcPorPagar" placeholder="Cuotas por pagar">

<input type="number" id="tcValor" placeholder="Valor">
<input type="number" id="tcPago" placeholder="Pago">

<button class="btn" onclick="guardarTC()">Guardar</button>
<button class="btn btnBlue" onclick="exportarExcel('tc')">Exportar</button>
</div>

<div class="card" id="listaTC"></div>
</section>

<section id="bancos">
<div class="card">
<input type="date" id="bFecha">
<select id="bBanco"><option>Guayaquil</option><option>Pichincha</option></select>
<select id="bTipo"><option>Ingreso</option><option>Egreso</option></select>

<input id="bConcepto" placeholder="Concepto">
<input id="bDetalle" placeholder="Detalle">
<input type="number" id="bValor" placeholder="Valor">

<button class="btn" onclick="guardarBanco()">Guardar</button>
<button class="btn btnBlue" onclick="exportarExcel('bancos')">Exportar</button>
</div>

<div class="card" id="listaBancos"></div>
</section>

<section id="resumen">
<div class="card">
<button class="btn btnBlue" onclick="descargarRespaldoHTML()">Bajar respaldo HTML</button>
</div>
</section>

<script>

let tc = [
{Fecha:"2026-05-03",Tarjeta:"Pichincha",Concepto:"Restaurante",Detalle:"Colibri",Tipo:"Corriente",Valor:15.95,Pago:0,Conciliado:"Si"},
{Fecha:"2026-05-03",Tarjeta:"Pichincha",Concepto:"Peluquería",Detalle:"Cepillado",Tipo:"Corriente",Valor:13,Pago:0,Conciliado:"Si"},
{Fecha:"2026-05-03",Tarjeta:"Pichincha",Concepto:"Hogar",Detalle:"Liwy",Tipo:"Corriente",Valor:2.33,Pago:0,Conciliado:"Si"}
];

let bancos = [
{Fecha:"2026-05-04",Banco:"Bolivariano",Tipo:"Egreso",Concepto:"Pago",Detalle:"Alicuota May26",Valor:185.91,Conciliado:"Si"},
{Fecha:"2026-05-04",Banco:"Guayaquil",Tipo:"Egreso",Concepto:"Pago",Detalle:"Jardin",Valor:20.41,Conciliado:"Si"}
];

function showTab(id,btn){
document.querySelectorAll("section").forEach(s=>s.classList.remove("active"));
document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
document.getElementById(id).classList.add("active");
btn.classList.add("active");
mostrar();
}

function controlCamposTC(){
let c = tcTipo.value==="Corriente";
tcPagadas.disabled=c;
tcPorPagar.disabled=c;
}

function guardarTC(){
tc.push({
Fecha:tcFecha.value,
Tarjeta:tcTarjeta.value,
Concepto:tcConcepto.value,
Detalle:tcDetalle.value,
Tipo:tcTipo.value,
Valor:Number(tcValor.value),
Pago:Number(tcPago.value),
Conciliado:"No"
});
mostrar();
}

function guardarBanco(){
bancos.push({
Fecha:bFecha.value,
Banco:bBanco.value,
Tipo:bTipo.value,
Concepto:bConcepto.value,
Detalle:bDetalle.value,
Valor:Number(bValor.value),
Conciliado:"No"
});
mostrar();
}

function mostrar(){
listaTC.innerHTML="";
tc.forEach((m,i)=>{
listaTC.innerHTML+=`
<div class="mov">
<b>${m.Fecha} ${m.Concepto}</b>
<div>${m.Detalle}</div>
<div>$${m.Valor}</div>
<button class="btn btnEdit" onclick="editarTC(${i})">EDITAR</button>
</div>`;
});

listaBancos.innerHTML="";
bancos.forEach((m,i)=>{
listaBancos.innerHTML+=`
<div class="mov">
<b>${m.Fecha} ${m.Banco}</b>
<div>${m.Detalle}</div>
<div>$${m.Valor}</div>
<button class="btn btnEdit" onclick="editarBanco(${i})">EDITAR</button>
</div>`;
});
}

function editarTC(i){
let m=tc[i];
tc[i].Valor=Number(prompt("Nuevo valor",m.Valor));
mostrar();
}

function editarBanco(i){
let m=bancos[i];
bancos[i].Valor=Number(prompt("Nuevo valor",m.Valor));
mostrar();
}

function exportarExcel(tipo){
let data=tipo==="tc"?tc:bancos;
let ws=XLSX.utils.json_to_sheet(data);
let wb=XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb,ws,"Datos");
XLSX.writeFile(wb,tipo+".xlsx");
}

function descargarRespaldoHTML(){
let contenido=`<pre>${JSON.stringify({tc,bancos},null,2)}</pre>`;
let blob=new Blob([contenido],{type:"text/html"});
let a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download="respaldo.html";
a.click();
}

mostrar();

</script>

</body>
</html>
