<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="BI Gerencial" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>BI Gerencial</title>
  <style>
    :root{
      --bg:#eef2f7; --card:#ffffff; --ink:#152033; --muted:#667085; --blue:#1f5eff;
      --blue2:#133ea7; --green:#0f8a5f; --orange:#b96300; --red:#b42318; --line:#d8dee9;
      --shadow:0 14px 32px rgba(16,24,40,.12); --radius:24px;
    }
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(135deg,#e9eef8,#f7f8fb 40%,#e6edf7);color:var(--ink);min-height:100vh;}
    .app{max-width:1120px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px 28px;}
    .hero{background:linear-gradient(135deg,#14213d,#1f5eff);border-radius:30px;color:white;padding:24px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
    .hero:after{content:"";position:absolute;right:-80px;top:-90px;width:250px;height:250px;border-radius:50%;background:rgba(255,255,255,.14)}
    .hero h1{margin:0;font-size:34px;letter-spacing:-.6px}.hero p{margin:8px 0 0;color:rgba(255,255,255,.82);font-size:15px;line-height:1.4}.hero .date{margin-top:14px;display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.14);padding:9px 12px;border-radius:999px;font-size:13px;}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 18px}.btn{border:0;border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;background:var(--card);box-shadow:0 4px 14px rgba(16,24,40,.08);color:var(--ink)}.btn.primary{background:var(--blue);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.orange{background:#fff4e5;color:#8a4600}.btn.red{background:#fff1f0;color:var(--red)}.btn:active{transform:scale(.98)}
    .search{width:100%;display:flex;gap:10px;margin-bottom:16px}.search input{width:100%;border:1px solid var(--line);border-radius:18px;padding:14px 16px;font-size:16px;background:#fff;outline:none;box-shadow:0 3px 10px rgba(16,24,40,.04)}
    .section{margin-top:22px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}.section-title h2{font-size:20px;margin:0}.badge{font-size:12px;color:var(--muted);background:#fff;padding:7px 10px;border-radius:999px;border:1px solid var(--line)}
    .grid{display:grid;grid-template-columns:repeat(3, minmax(0,1fr));gap:14px}.card{background:rgba(255,255,255,.92);border:1px solid rgba(216,222,233,.9);border-radius:var(--radius);padding:17px;box-shadow:0 7px 22px rgba(16,24,40,.08);min-height:160px;display:flex;flex-direction:column;justify-content:space-between;}
    .card h3{margin:0 0 6px;font-size:18px;line-height:1.18}.meta{font-size:13px;color:var(--muted);line-height:1.35}.prep{margin-top:8px;color:#475467}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.small{padding:9px 11px;border-radius:13px;font-size:13px}.open{background:#12233f;color:#fff}.edit{background:#eef4ff;color:#1f5eff}.copy{background:#f2f4f7;color:#344054}.disabled{opacity:.52}.empty{padding:28px;text-align:center;color:var(--muted);background:#fff;border-radius:var(--radius);border:1px dashed var(--line)}
    dialog{border:0;border-radius:24px;box-shadow:0 24px 70px rgba(16,24,40,.35);width:min(94vw,620px);padding:0} dialog::backdrop{background:rgba(15,23,42,.45)}.modal{padding:22px}.modal h2{margin:0 0 14px}.form{display:grid;gap:12px}.form label{font-size:13px;font-weight:700;color:#344054}.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:15px;outline:none}.form textarea{min-height:72px;resize:vertical}.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}.hint{font-size:12px;color:var(--muted);line-height:1.4}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#101828;color:#fff;padding:12px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:99}.toast.show{opacity:1;bottom:34px}
    @media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero h1{font-size:30px}}@media(max-width:560px){.app{padding-left:14px;padding-right:14px}.grid{grid-template-columns:1fr}.hero{padding:21px;border-radius:26px}.hero h1{font-size:28px}.toolbar .btn{flex:1}.card{min-height:150px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1>BI Gerencial</h1>
      <p>Acceso rápido a reportes Power BI para iPad mini. Puedes agregar, editar, copiar enlaces y respaldar este HTML.</p>
      <div class="date" id="lastUpdated">Actualizado: —</div>
    </header>

    <div class="toolbar">
      <button class="btn primary" onclick="newBI()">➕ Nuevo BI</button>
      <button class="btn green" onclick="backupHTML()">💾 Respaldar HTML</button>
      <button class="btn" onclick="exportLinks()">📤 Exportar links</button>
      <button class="btn orange" onclick="resetSeed()">↩️ Restaurar base</button>
    </div>

    <div class="search"><input id="q" placeholder="Buscar por nombre, categoría, preparador o descripción..." oninput="render()" /></div>
    <main id="content"></main>
  </div>

  <dialog id="editor">
    <div class="modal">
      <h2 id="modalTitle">Editar BI</h2>
      <div class="form">
        <input type="hidden" id="idx" />
        <div><label>Nombre del BI</label><input id="name" placeholder="Ej: Ventas, Costos, Balance" /></div>
        <div><label>Categoría</label><select id="category"><option>PROEXPO</option><option>OPERATIVO</option><option>COMERCIAL</option><option>EXTERNOS</option><option>OTROS</option></select></div>
        <div><label>Preparado por</label><input id="owner" placeholder="Ej: Alexandra Quiros" /></div>
        <div><label>Descripción</label><textarea id="desc" placeholder="Ej: Margen comercial, ventas por talla..."></textarea></div>
        <div><label>Link Power BI</label><input id="url" placeholder="https://app.powerbi.com/links/..." /></div>
        <p class="hint">Sugerencia: usa el vínculo corto de Power BI desde Compartir → Copiar vínculo. Si el link cambia, solo editas aquí y guardas.</p>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeEditor()">Cancelar</button>
        <button class="btn red" id="deleteBtn" onclick="deleteBI()">Eliminar</button>
        <button class="btn primary" onclick="saveBI()">Guardar</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast"></div>

  <script id="app-data" type="application/json">[
    {"category":"PROEXPO","name":"Balance de Situación","owner":"Alexandra Quiros","desc":"","url":"https://app.powerbi.com/links/BTMc6D_lBy"},
    {"category":"PROEXPO","name":"PL","owner":"Alexandra Quiros","desc":"","url":"https://app.powerbi.com/links/a0HwQW_njT"},
    {"category":"PROEXPO","name":"Indicadores Financieros","owner":"Alexandra Quiros","desc":"","url":"https://app.powerbi.com/links/flJIOPe0Nk"},
    {"category":"OPERATIVO","name":"Variación de Costos y Gastos","owner":"Jennifer Dominguez","desc":"Costos y Gastos por rubro","url":"https://app.powerbi.com/links/FYjl6jsUYF"},
    {"category":"OPERATIVO","name":"Análisis de Operación Empacadora","owner":"Jennifer Dominguez","desc":"Ventas por Talla, Margen Comercial","url":"https://app.powerbi.com/links/2TpJSaX7Hp"},
    {"category":"COMERCIAL","name":"Margen Comercial Cliente y Procesos","owner":"Jennifer Dominguez","desc":"Margen por Cliente","url":""}
  ]</script>

  <script>
    const STORAGE_KEY = 'bi_gerencial_links_v1';
    const UPDATED_KEY = 'bi_gerencial_updated_v1';
    const seed = JSON.parse(document.getElementById('app-data').textContent);
    let data = loadData();

    function loadData(){
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || seed; } catch(e){ return seed; }
    }
    function persist(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      localStorage.setItem(UPDATED_KEY, new Date().toISOString());
      document.getElementById('app-data').textContent = JSON.stringify(data, null, 2);
      setUpdated();
    }
    function setUpdated(){
      const iso = localStorage.getItem(UPDATED_KEY);
      const d = iso ? new Date(iso) : new Date();
      document.getElementById('lastUpdated').textContent = 'Actualizado: ' + d.toLocaleDateString('es-EC', {year:'numeric', month:'long', day:'numeric'}) + ' · ' + d.toLocaleTimeString('es-EC',{hour:'2-digit',minute:'2-digit'});
    }
    function cleanUrl(url){
      url = (url || '').trim();
      const m = url.match(/https:\/\/app\.powerbi\.com\/links\/[^?\s]+/i);
      return m ? m[0] : url;
    }
    function iconFor(cat){
      const c=(cat||'').toUpperCase();
      if(c.includes('PROEXPO')) return '🏢'; if(c.includes('OPERATIVO')) return '⚙️'; if(c.includes('COMERCIAL')) return '👥'; if(c.includes('EXTER')) return '🌐'; return '📁';
    }
    function render(){
      setUpdated();
      const q = (document.getElementById('q').value || '').toLowerCase();
      const filtered = data.filter(x => [x.name,x.category,x.owner,x.desc,x.url].join(' ').toLowerCase().includes(q));
      const groups = [...new Set(filtered.map(x=>x.category || 'OTROS'))];
      const content = document.getElementById('content');
      if(!filtered.length){ content.innerHTML='<div class="empty">No encontré BI con ese criterio.</div>'; return; }
      content.innerHTML = groups.map(cat => {
        const items = filtered.filter(x => (x.category||'OTROS') === cat);
        return `<section class="section"><div class="section-title"><h2>${iconFor(cat)} ${cat}</h2><span class="badge">${items.length} BI</span></div><div class="grid">${items.map(card).join('')}</div></section>`;
      }).join('');
    }
    function card(item){
      const realIndex = data.indexOf(item);
      const hasUrl = !!(item.url && item.url.trim());
      return `<article class="card"><div><h3>${escapeHTML(item.name || 'Sin nombre')}</h3><div class="meta">${escapeHTML(item.desc || 'Sin descripción')}</div><div class="meta prep">Preparado por: ${escapeHTML(item.owner || '—')}</div></div><div class="actions"><button class="btn small open ${hasUrl?'':'disabled'}" onclick="openBI(${realIndex})">Abrir</button><button class="btn small edit" onclick="editBI(${realIndex})">Editar</button><button class="btn small copy ${hasUrl?'':'disabled'}" onclick="copyBI(${realIndex})">Copiar link</button></div></article>`;
    }
    function escapeHTML(s){ return String(s||'').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    function openBI(i){ const u = cleanUrl(data[i].url); if(!u){ toast('Este BI todavía no tiene link.'); return; } window.open(u, '_blank'); }
    async function copyBI(i){ const u = cleanUrl(data[i].url); if(!u){ toast('No hay link para copiar.'); return; } try{ await navigator.clipboard.writeText(u); toast('Link copiado.'); }catch(e){ prompt('Copia el link:', u); } }
    function newBI(){ document.getElementById('modalTitle').textContent='Nuevo BI'; document.getElementById('idx').value=''; document.getElementById('name').value=''; document.getElementById('category').value='OTROS'; document.getElementById('owner').value=''; document.getElementById('desc').value=''; document.getElementById('url').value=''; document.getElementById('deleteBtn').style.display='none'; document.getElementById('editor').showModal(); }
    function editBI(i){ const x=data[i]; document.getElementById('modalTitle').textContent='Editar BI'; document.getElementById('idx').value=i; document.getElementById('name').value=x.name||''; document.getElementById('category').value=x.category||'OTROS'; document.getElementById('owner').value=x.owner||''; document.getElementById('desc').value=x.desc||''; document.getElementById('url').value=x.url||''; document.getElementById('deleteBtn').style.display='inline-block'; document.getElementById('editor').showModal(); }
    function closeEditor(){ document.getElementById('editor').close(); }
    function saveBI(){ const obj={category:document.getElementById('category').value,name:document.getElementById('name').value.trim()||'Sin nombre',owner:document.getElementById('owner').value.trim(),desc:document.getElementById('desc').value.trim(),url:cleanUrl(document.getElementById('url').value)}; const idx=document.getElementById('idx').value; if(idx==='') data.push(obj); else data[Number(idx)]=obj; persist(); closeEditor(); render(); toast('BI guardado.'); }
    function deleteBI(){ const idx=Number(document.getElementById('idx').value); if(Number.isInteger(idx) && confirm('¿Eliminar este BI?')){ data.splice(idx,1); persist(); closeEditor(); render(); toast('BI eliminado.'); } }
    function resetSeed(){ if(confirm('¿Restaurar la base original? Se reemplazarán los cambios guardados en este dispositivo.')){ data = JSON.parse(JSON.stringify(seed)); persist(); render(); toast('Base restaurada.'); } }
    function exportLinks(){ const rows=[['Categoria','Nombre','Preparado por','Descripcion','Link'],...data.map(x=>[x.category,x.name,x.owner,x.desc,cleanUrl(x.url)])]; const csv=rows.map(r=>r.map(v=>'"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n'); downloadBlob(csv,'BI_Gerencial_links.csv','text/csv;charset=utf-8'); }
    function backupHTML(){ persist(); const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML; const stamp=new Date().toISOString().slice(0,10); downloadBlob(html,`BI_Gerencial_respaldo_${stamp}.html`,'text/html;charset=utf-8'); toast('Respaldo HTML generado.'); }
    function downloadBlob(content, filename, type){ const blob=new Blob([content],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500); }
    function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
    render();
  </script>
</body>
</html>
