nav{display:flex;background:white;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.08)}
nav button{flex:1;padding:12px 4px;border:0;background:white;font-weight:700;color:#334155;font-size:13px}
nav button.active{background:#0f172a;color:white}
section{display:none;padding:16px} section.active{display:block}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
label{font-size:13px;font-weight:700;color:#475569}
input,select{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;box-sizing:border-box}

.mov{border-bottom:1px solid #e5e7eb;padding:12px 0}
.mov strong{display:block;font-size:15px}
.num{display:inline-block;background:#0f172a;color:white;border-radius:999px;padding:3px 9px;margin-right:6px;font-size:12px}
.small{font-size:13px;color:#64748b;margin-top:3px} .ok{color:#15803d;font-weight:800} .no{color:#dc2626;font-weight:800}

table{width:100%;border-collapse:collapse;font-size:13px} th,td{border-bottom:1px solid #e5e7eb;padding:8px;text-align:right} th:first-child,td:first-child{text-align:left}

<body>
<header>Mis Finanzas</header>
<nav>
<button class="active" data-tab="tc">TC</button><button data-tab="bancos">Bancos</button><button data-tab="amortizacion">Amort.</button><button data-tab="resumen">Resumen</button>
</nav>

<section id="tc" class="active">
<div class="card"><h2>Consumos Tarjeta</h2>
<label>Fecha</label><input type="date" id="tcFecha">
<label>Tarjeta</label><select id="tcTarjeta"><option>Pichincha</option><option>Produbanco</option><option>Otra</option></select>
<label>Concepto</label><select id="tcConcepto"><option>Restaurante</option><option>Supermercado</option><option>Gasolina/Carro</option><option>Medicina</option><option>Doctor</option><option>Peluquería</option><option>Veterinaria</option><option>Tecnologico/Electrico</option><option>Hogar</option><option>Otros</option></select>
<label>Detalle</label><input id="tcDetalle" placeholder="Ej: farmacia, cena, supermercado">
<label>Tipo consumo</label><select id="tcTipo"><option>Corriente</option><option>Diferido</option></select>
<label>Número de cuotas</label><input type="number" id="tcCuotas" value="0" min="0">
<label>Valor consumo</label><input type="number" id="tcValor" step="0.01">
<label>Pago / cuota automática</label><input type="number" id="tcPago" step="0.01" value="0" disabled>
<button class="btn" id="btnGuardarTC">Guardar TC</button>
<div class="exportBox"><h4>Exportar TC a Excel</h4><label>Qué deseas bajar</label><select id="exportEstadoTC"><option value="no">No conciliados</option><option value="si">Conciliados</option><option value="todos">Todos</option></select><button class="btn btn2" onclick="exportarMovimientos('tc')">Exportar TC según selección</button><div class="btnRow"><button class="btn btnGreen" onclick="exportarMovimientosEstado('tc','no')">Bajar NO conciliados y marcarlos conciliados</button><button class="btn btn2" onclick="exportarMovimientosEstado('tc','si')">Bajar conciliados</button><button class="btn btn2" onclick="exportarMovimientosEstado('tc','todos')">Bajar todos</button></div></div>
</div>
<div class="card"><h3>Movimientos TC</h3><label>Filtrar por tarjeta</label><select id="filtroTarjetaTC"></select><div class="filtros"><button id="fTCtodos" class="active" onclick="setFiltroTC('todos')">Todos</button><button id="fTCno" onclick="setFiltroTC('no')">No conciliados</button><button id="fTCsi" onclick="setFiltroTC('si')">Conciliados</button></div><div id="listaTC"></div></div>
</section>

<section id="bancos">
<div class="card"><h2>Movimientos Bancos</h2>
<label>Fecha</label><input type="date" id="bFecha"><label>Banco</label><select id="bBanco"><option>Pichincha</option><option>Produbanco</option><option>Guayaquil</option><option>Bolivariano</option><option>Otro</option></select>
<label>Tipo</label><select id="bTipo"><option>Ingreso</option><option>Egreso</option></select>
<label>Concepto</label><select id="bConcepto"><option>Transferencia</option><option>Pago</option><option>Retiro</option><option>Depósito</option><option>Servicios</option><option>Otros</option></select>
<label>Detalle</label><input id="bDetalle" placeholder="Detalle"><label>Valor</label><input type="number" id="bValor" step="0.01"><button class="btn" id="btnGuardarBanco">Guardar Banco</button><div class="exportBox"><h4>Exportar Bancos a Excel</h4><label>Qué deseas bajar</label><select id="exportEstadoBancos"><option value="no">No conciliados</option><option value="si">Conciliados</option><option value="todos">Todos</option></select><button class="btn btn2" onclick="exportarMovimientos('bancos')">Exportar Bancos según selección</button><div class="btnRow"><button class="btn btnGreen" onclick="exportarMovimientosEstado('bancos','no')">Bajar NO conciliados y marcarlos conciliados</button><button class="btn btn2" onclick="exportarMovimientosEstado('bancos','si')">Bajar conciliados</button><button class="btn btn2" onclick="exportarMovimientosEstado('bancos','todos')">Bajar todos</button></div></div></div>
<div class="card"><h3>Movimientos Bancos</h3><div class="filtros"><button id="fBtodos" class="active" onclick="setFiltroBanco('todos')">Todos</button><button id="fBno" onclick="setFiltroBanco('no')">No conciliados</button><button id="fBsi" onclick="setFiltroBanco('si')">Conciliados</button></div><div id="listaBancos"></div></div>
</section>

<section id="amortizacion"><div class="card"><h2>Calculadora de Amortización</h2><label>Monto del préstamo</label><input type="number" id="amoMonto" step="0.01"><label>Tasa anual %</label><input type="number" id="amoTasa" step="0.01"><label>Plazo en meses</label><input type="number" id="amoMeses"><button class="btn" onclick="calcularAmortizacion()">Calcular</button><button class="btn btn2" onclick="exportarAmortizacion()">Exportar Amortización a Excel</button></div><div class="card"><div id="resumenAmo"></div><div style="overflow:auto"><table id="tablaAmo"></table></div></div></section>

<section id="resumen"><div class="card"><h2>Resumen mensual</h2><label>Mes</label><select id="resMes" onchange="generarResumen()"></select><label>Origen</label><select id="resOrigen" onchange="cargarFiltrosResumen();generarResumen()"><option value="todos">TC + Bancos</option><option value="tc">Solo TC</option><option value="bancos">Solo Bancos</option></select><label>Tarjeta / Banco</label><select id="resEntidad" onchange="generarResumen()"></select><label>Estado</label><select id="resEstado" onchange="generarResumen()"><option value="todos">Todos</option><option value="no">No conciliados</option><option value="si">Conciliados</option></select><label>Concepto</label><select id="resConcepto" onchange="generarResumen()"></select><button class="btn btnGreen" onclick="descargarRespaldoJSON()">Descargar respaldo REAL de movimientos JSON</button><button class="btn btnGreen" onclick="respaldarCodigoFuenteCompleto()">Respaldar CÓDIGO FUENTE completo + movimientos</button><input type="file" id="archivoImportar" accept=".json,.html" style="display:none" onchange="importarRespaldo(event)"><button class="btn btnGreen" onclick="document.getElementById('archivoImportar').click()">Cargar respaldo de movimientos</button><button class="btn btn2" onclick="respaldarHTMLCompleto()">Respaldar reporte HTML de datos</button><button class="btn btn2" onclick="exportarResumen()">Exportar Resumen a Excel</button><button class="btn btnDanger" onclick="restaurarMovimientosBase()">Restaurar movimientos del respaldo cargado</button></div><div class="card"><div id="totalResumen" class="total"></div><div id="conteoMov" class="small"></div><div style="overflow:auto"><table id="tablaResumen"></table></div></div></section>

<div id="modalEditar" class="modalFondo"><div class="modalCard"><div class="modalHeader"><h2 id="modalTitulo">Editar movimiento</h2><button class="btnSmall" onclick="cerrarEditor()">Cerrar</button></div><input type="hidden" id="editOrigen"><input type="hidden" id="editId"><label>Fecha</label><input type="date" id="editFecha"><div id="editTCBox"><label>Tarjeta</label><select id="editTarjeta"><option>Pichincha</option><option>Produbanco</option><option>Otra</option></select><label>Concepto</label><select id="editConceptoTC"><option>Restaurante</option><option>Supermercado</option><option>Gasolina/Carro</option><option>Medicina</option><option>Doctor</option><option>Peluquería</option><option>Veterinaria</option><option>Tecnologico/Electrico</option><option>Hogar</option><option>Otros</option></select><label>Tipo consumo</label><select id="editTipoTC"><option>Corriente</option><option>Diferido</option></select><div class="grid2"><div><label>Número de cuotas</label><input type="number" id="editCuotas" value="0"></div><div><label>Valor consumo</label><input type="number" id="editValorTC" step="0.01"></div></div><label>Pago / cuota automática</label><input type="number" id="editPagoTC" step="0.01" disabled></div><div id="editBancoBox"><label>Banco</label><select id="editBanco"><option>Pichincha</option><option>Produbanco</option><option>Guayaquil</option><option>Bolivariano</option><option>Otro</option></select><label>Tipo</label><select id="editTipoBanco"><option>Ingreso</option><option>Egreso</option></select><label>Concepto</label><select id="editConceptoBanco"><option>Transferencia</option><option>Pago</option><option>Retiro</option><option>Depósito</option><option>Servicios</option><option>Otros</option></select><label>Valor</label><input type="number" id="editValorBanco" step="0.01"></div><label>Detalle</label><input id="editDetalle"><label>Estado</label><select id="editConciliado"><option value="No">No conciliado</option><option value="Si">Conciliado</option></select><button class="btn" onclick="guardarEdicion()">Guardar cambios</button><button class="btn btnDanger" onclick="cerrarEditor()">Cancelar</button></div></div>

function exportarMovimientos(tipo){
  const selector = tipo==='tc' ? document.getElementById('exportEstadoTC') : document.getElementById('exportEstadoBancos');
  const estadoElegido = selector ? selector.value : 'no';
  const origen = tipo==='tc' ? tc : bancos;

  let data = origen.filter(m=>{
    if(estadoElegido==='no') return m.Conciliado !== 'Si';
    if(estadoElegido==='si') return m.Conciliado === 'Si';
    return true;
  });

  if(!data.length){
    const texto = estadoElegido==='no' ? 'no conciliados' : (estadoElegido==='si' ? 'conciliados' : 'guardados');
    alert('No hay movimientos '+texto+' para exportar.');
    return;
  }

  const dataExportar = ordenarPorFecha(data).map((m,i)=>({
    Numero: i + 1,
    Fecha: m.Fecha,
    TipoMovimiento: tipo==='tc' ? 'TC' : 'Banco',
    TarjetaBanco: tipo==='tc' ? m.Tarjeta : m.Banco,
    Tipo: m.Tipo || '',
    Concepto: m.Concepto || '',
    Detalle: m.Detalle || '',
    Valor: Number(m.Valor || 0),
    Pago: tipo==='tc' ? Number(m.Pago || 0) : Number(m.Valor || 0),
    Cuotas: tipo==='tc' ? Number(m.CuotasPorPagar || 0) : '',
    SaldoDiferido: tipo==='tc' ? Number(m.SaldoDiferido || 0) : '',
    EstadoAntesExportar: m.Conciliado==='Si' ? 'Conciliado' : 'No conciliado'
  }));

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(dataExportar);
  XLSX.utils.book_append_sheet(wb, ws, tipo==='tc' ? 'TC' : 'Bancos');
  const etiqueta = estadoElegido==='no' ? 'No_Conciliados' : (estadoElegido==='si' ? 'Conciliados' : 'Todos');
  XLSX.writeFile(wb, (tipo==='tc'?'TC_':'Bancos_') + etiqueta + '_' + new Date().toISOString().slice(0,10) + '.xlsx');

  if(estadoElegido==='no'){
    const idsExportados = new Set(data.map(m=>m._id));
    if(tipo==='tc'){
      tc = tc.map(m => idsExportados.has(m._id) ? {...m, Conciliado:'Si'} : m);
    }else{
      bancos = bancos.map(m => idsExportados.has(m._id) ? {...m, Conciliado:'Si'} : m);
    }
    reconstruirTodo();
    alert((tipo==='tc'?'TC':'Bancos') + ' no conciliados exportados y marcados como conciliados.');
  }else{
    reconstruirTodo();
    alert((tipo==='tc'?'TC':'Bancos') + ' exportados. No cambié el estado porque no exportaste solo no conciliados.');
  }
}
function exportarResumen(){ const wb=XLSX.utils.book_new(); const ws=XLSX.utils.table_to_sheet(tablaResumen); XLSX.utils.book_append_sheet(wb,ws,'Resumen'); XLSX.writeFile(wb,'Resumen_'+new Date().toISOString().slice(0,10)+'.xlsx'); }
function calcularAmortizacion(){ const monto=Number(amoMonto.value||0), tasa=Number(amoTasa.value||0)/100/12, meses=Number(amoMeses.value||0); if(!monto||!meses){alert('Falta monto o plazo');return;} const cuota=tasa?monto*(tasa*Math.pow(1+tasa,meses))/(Math.pow(1+tasa,meses)-1):monto/meses; let saldo=monto,totalInteres=0; amortizacion=[]; for(let i=1;i<=meses;i++){ let interes=saldo*tasa; let capital=cuota-interes; saldo=Math.max(saldo-capital,0); totalInteres+=interes; amortizacion.push({Cuota:i,Pago:cuota,Capital:capital,Interes:interes,Saldo:saldo}); } resumenAmo.innerHTML='<b>Cuota mensual:</b> $'+formato(cuota)+'<br><b>Total intereses:</b> $'+formato(totalInteres); tablaAmo.innerHTML='<tr><th>#</th><th>Pago</th><th>Capital</th><th>Interés</th><th>Saldo</th></tr>'+amortizacion.map(r=>`<tr><td>${r.Cuota}</td><td>$${formato(r.Pago)}</td><td>$${formato(r.Capital)}</td><td>$${formato(r.Interes)}</td><td>$${formato(r.Saldo)}</td></tr>`).join(''); }
function exportarAmortizacion(){ if(!amortizacion.length){alert('Primero calcula la amortización');return;} const wb=XLSX.utils.book_new(); const ws=XLSX.utils.json_to_sheet(amortizacion); XLSX.utils.book_append_sheet(wb,ws,'Amortizacion'); XLSX.writeFile(wb,'Amortizacion.xlsx'); }
